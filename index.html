<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 안산시 대학SDGs포럼 초대장</title>
<meta name="description" content="2026. 11. 11.(수) 14:00~16:30 · 안산대학교 성실관 WINGS홀">
<!-- 배포 주소 확정 후: og:url, og:image 를 https 절대 주소로 교체하세요 (README 참고) -->
<meta property="og:type" content="website">
<meta property="og:title" content="2026 안산시 대학SDGs포럼 초대장">
<meta property="og:description" content="2026. 11. 11.(수) 14:00~16:30 · 안산대학교 성실관 WINGS홀">
<meta property="og:url" content="">
<meta property="og:image" content="assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="theme-color" content="#42297a">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preload" as="image" href="assets/sdg-wheel.webp">
<link rel="stylesheet" href="styles.css">
<script>document.documentElement.classList.add('js');</script>
</head>
<body>

<!-- 0. 인트로 -->
<div class="intro" id="intro" role="dialog" aria-label="인트로">
  <p class="intro-kicker" id="introKicker"></p>
  <p class="intro-text" id="introText"></p>
  <span class="intro-bar" aria-hidden="true"></span>
  <button type="button" class="intro-skip" id="introSkip">화면을 누르면 바로 시작합니다</button>
</div>

<!-- 배경음악 (음원이 없으면 script.js 가 버튼을 제거합니다) -->
<button type="button" class="bgm" id="bgm" aria-pressed="false" aria-label="배경음악 켜기" hidden>
  <svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="m16 9 6 6M22 9l-6 6"/></svg>
</button>

<main class="wrap" id="main">

  <!-- 1. 메인 -->
  <section class="hero" aria-labelledby="eventTitle">
    <p class="slogan" id="slogan"></p>
    <img class="hero-wheel" id="heroWheel" src="assets/sdg-wheel.webp" width="1100" height="1020" alt="">
    <h1 class="event-title" id="eventTitle"></h1>
    <dl class="info-card" id="infoCard"></dl>
  </section>

  <!-- 2. 모시는 글 -->
  <section class="sec alt" aria-labelledby="greetingTitle">
    <p class="eng reveal">GREETING</p>
    <h2 class="sec-title reveal" id="greetingTitle">모시는 글</h2>
    <div class="greeting" id="greeting"></div>
  </section>

  <!-- 3. 행사 식순 -->
  <section class="sec" aria-labelledby="programTitle">
    <p class="eng reveal">PROGRAM</p>
    <h2 class="sec-title reveal" id="programTitle">행사 식순</h2>
    <ol class="program" id="program"></ol>
  </section>

  <!-- 4. 참가신청 -->
  <section class="sec alt apply" aria-labelledby="applyTitle">
    <p class="eng reveal">APPLY</p>
    <h2 class="sec-title reveal" id="applyTitle">참가신청</h2>
    <ul class="apply-notes reveal" id="applyNotes"></ul>
    <a class="btn primary full reveal" id="applyBtn" target="_blank" rel="noopener">참가 신청하기</a>
  </section>

  <!-- 5. 포럼 소개 · 참여 대학 -->
  <section class="sec" aria-labelledby="aboutTitle">
    <p class="eng reveal">ABOUT</p>
    <h2 class="sec-title reveal" id="aboutTitle">포럼 소개 · 참여 대학</h2>
    <div class="about" id="about"></div>
  </section>

  <!-- 6. 오시는 길 -->
  <section class="sec alt" aria-labelledby="locationTitle">
    <p class="eng reveal">LOCATION</p>
    <h2 class="sec-title reveal" id="locationTitle">오시는 길</h2>
    <div class="location" id="location"></div>
  </section>

  <!-- 7. 공유 · 문의 · 주최 주관 -->
  <section class="sec closing" aria-label="공유와 문의">
    <div class="share reveal">
      <button type="button" class="btn kakao full" id="shareBtn">카카오톡으로 공유하기</button>
      <button type="button" class="btn full" id="copyBtn">초대장 주소 복사하기</button>
    </div>
    <p class="inquiry reveal" id="inquiry"></p>
    <div class="orgs reveal" id="orgs"></div>
  </section>
</main>

<!-- 포스터 확대 보기 -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="포스터 확대 보기" hidden>
  <button type="button" class="lb-close" id="lbClose" aria-label="닫기">✕</button>
  <div class="lb-scroll" id="lbScroll"><img id="lbImg" alt="" decoding="async"></div>
  <p class="lb-hint">사진을 누르면 확대·축소됩니다</p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
